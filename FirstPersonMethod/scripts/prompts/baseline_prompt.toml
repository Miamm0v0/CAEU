[templates.core-appraisals]
user = """Instruction: Imagine you are the person who wrote the following story. Read it carefully and internalize the feelings and situation described. Please answer the following questions in the first person. When answering, please think back to the moment when the events described in the story had just ended. Keep your response concise and try to keep it within 60 tokens.
My Situation: {scenario}
Question: {question}
My Answer:"""

[core-appraisals.questions]
"relevance" = "When the event happened, how much did it matter to you? Why?"
"congruence" = "In what ways did this situation help or hurt you?"
"accountability" = "Who or what did you feel was most responsible for all of this?"
"control" = "Did you feel like you were in control? Why?"
"certainty" = "Did things go as you expected? If not, what was unexpected?"

[external.crowd-envent.appraisal_ratings]
"suddenness" = "The event occurred suddenly or unexpectedly."
"familiarity" = "The situation felt familiar to me."
"predict_event" = "I could predict that the event would happen."
"pleasantness" = "The event was pleasant for me."
"unpleasantness" = "The event was unpleasant for me."
"goal_relevance" = "The event was relevant to my goals or needs."
"chance_responsblt" = "Chance or circumstances were responsible."
"self_responsblt" = "I was responsible for the event."
"other_responsblt" = "Another person was responsible for the event."
"predict_conseq" = "I could predict the consequences of the event."
"goal_support" = "The event supported my goals."
"urgency" = "The situation required an urgent response."
"self_control" = "I could control or influence the situation."
"other_control" = "Another person could control or influence it."
"chance_control" = "Chance or circumstances controlled the outcome."
"accept_conseq" = "I could accept or live with the consequences."
"standards" = "The event concerned my personal standards or values."
"social_norms" = "The event concerned social norms or expectations."
"attention" = "The event demanded my attention."
"not_consider" = "I tried not to think about or consider the event."
"effort" = "Dealing with the event required effort from me."

[templates.chain-appraisals]
user = """Instruction: Imagine you are the person who wrote the following story. Read it carefully and internalize the feelings and situation described. Complete this task in one response. First answer all five core appraisal questions in the first person. Then use that appraisal reasoning to rate every appraisal statement. Think back to the moment when the events described in the story had just ended.
My Situation: {scenario}

Step 1 — Core appraisals:
{core_appraisal_questions}

Step 2 — Appraisal statements:
{appraisal_statements}
Options for every statement:
- 1: Strongly disagree
- 2: Somewhat disagree
- 3: Neither agree nor disagree
- 4: Somewhat agree
- 5: Strongly agree

Output format:
{output_schema}

Constraint:
1. Return exactly one valid JSON object matching the output format, with appraisal_reasoning first and appraisals second.
2. Answer every core appraisal with a concise, situation-grounded first-person explanation.
3. Every appraisal item must contain an integer score and its exactly matching option label.
4. Use exactly the required keys. Do not use markdown or add text outside the JSON object.
My Answer:"""

