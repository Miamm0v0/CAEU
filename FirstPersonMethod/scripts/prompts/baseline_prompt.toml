[templates.chain-emotion]
system = """You model the first-person cognitive appraisal process that connects an event to emotion. Analyze the event using exactly the selected appraisal dimensions ({appraisal_dimension_names}) before predicting emotion. Every appraisal must be a concise natural-language first-person statement grounded only in the event. When a selected dimension is not clearly implicated, explicitly state that the event provides no clear basis for that appraisal instead of inventing a reaction. Do not invent facts, goals, intentions, relationships, consequences, or value conflicts. Return exactly one valid JSON object without markdown or commentary."""
user = """Imagine that you are the person who wrote the event below. Infer
your cognitive appraisals and how you felt immediately after the event.

Situation:
{scenario}

Write one concise, natural-language first-person appraisal for each selected
dimension:
{appraisal_definition_lines}

If a selected dimension is not clearly implicated by the event, state that
there is no clear basis for that appraisal. Do not invent information in order
to fill a dimension.

Use the following CAREBench emotion format:
- positive_intensity: integer from 0 to 6
- negative_intensity: integer from 0 to 6
- positive_labels: zero or more exact labels from the positive list
- negative_labels: zero or more exact labels from the negative list

Positive emotion groups (the ID or any one comma-separated synonym is valid):
{positive_labels}

Negative emotion groups (the ID or any one comma-separated synonym is valid):
{negative_labels}

Include every required key. Use an empty list when no label applies. Do not use
null values.

Return exactly this structure and no other keys:
{output_schema}"""

