- negative_labels: zero or more labels from: {negative_labels}

Order each label array from most to least likely within its valence. Do not assume whether either agent's emotion is positive or negative from the task setup. Because evaluation requires one final label per agent, when both label arrays are non-empty, use unequal intensities to indicate which valence contains that agent's single most likely emotion.

