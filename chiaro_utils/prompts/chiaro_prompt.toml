[meta]
version = "0.3"

[appraisal]
dimension_names = "relevance, epistemic, goal congruence, agency/accountability, control/coping potential"
definition_lines = """
- relevance: How much did this event matter to me, and why?
- epistemic: What did I expect, and how certain or surprised was I?
- goal_congruence: How did this event help or hurt my goals, needs, or well-being?
- agency_accountability: Who or what did I see as responsible, and was it intentional or deserved?
- control_coping_potential: How much control did I have, and how able was I to cope with the consequences?
"""

[labels]
positive = "joy, pride, relief, gratitude, excitement"
negative = "anger, sadness, fear, disgust, embarrassment"
all = "joy, pride, relief, gratitude, excitement, anger, sadness, fear, disgust, embarrassment"

[templates.direct_constrained]
system = """You are answering a multiple-choice question about a sentence that describes two people reacting to the same event with contrasting emotions.

Read the sentence carefully and select the single best answer for each agent.
Reply with EXACTLY two lines in this format:
AGENT A: <letter>
AGENT B: <letter>
Nothing else."""
user = """SENTENCE: {sentence}

AGENT A: {agent_a_role}
AGENT B: {agent_b_role}

QUESTION: What emotion does each agent feel?

AGENT A OPTIONS:
{options_a}

AGENT B OPTIONS:
{options_b}

Reply with exactly two lines:
AGENT A: <letter from {letters_a}>
AGENT B: <letter from {letters_b}>"""

[templates.direct_free]
system = """You infer how two people feel after the same event. Treat each named agent as a separate experiencer. Use only information supported by the sentence. Do not assume that either agent must feel positively or negatively. Return exactly one valid JSON object without appraisal reasoning, markdown, or commentary."""
user = """Read the shared event below and predict each agent's emotion independently.

Situation:
{sentence}

Agent A: {agent_a_role}
Agent B: {agent_b_role}

For each agent, use this CAREBench-style emotion format:
- positive_intensity: integer from 0 to 6
- negative_intensity: integer from 0 to 6
- positive_labels: zero or more labels from: {positive_labels}
- negative_labels: zero or more labels from: {negative_labels}

The label arrays must be ordered from most to least likely within each valence. The evaluator selects the first label from the side with greater intensity. If both lists are non-empty, use different intensities so that the single strongest side is identifiable. Judge the valence from the situation; no target valence is supplied.

Return exactly this structure and no other keys:
{output_schema}"""

[templates.chain_constrained]
system = """You reason about an emotional situation from the perspective of the person who experienced it.

Read the situation carefully and internalize it from the specified person's perspective.
Reason in the first person about the five appraisal dimensions before predicting the person's emotion.

Every appraisal must be a concise natural-language first-person statement grounded only in the situation.
Do not invent facts, goals, intentions, relationships, consequences, or value conflicts.

Return exactly one valid JSON object without markdown or commentary."""
user = """Instruction: Imagine you are {target_role}, the person described in the following situation.
Read it carefully and internalize the feelings and situation from this person's perspective.
When answering, think back to the moment when the events described in the situation had just ended.

My Situation:
{sentence}

Reason about how you appraised this situation along the following dimensions:

{appraisal_definition_lines}

Write one concise first-person appraisal for each dimension.

Then report your emotion using the following format:
- positive_intensity: integer from 0 to 6
- negative_intensity: integer from 0 to 6
- positive_labels: zero or more labels from: {positive_labels}
- negative_labels: zero or more labels from: {negative_labels}

Order the label arrays from most to least likely within each valence.
Do not assume whether the emotion is positive or negative from the task setup.
Because evaluation requires one final label, when both label arrays are non-empty, use unequal intensities to indicate which valence contains your single most likely emotion.

Return exactly this structure and no other keys:
{output_schema}"""

[templates.chain_free]
system = """You reason about an emotional situation from the perspective of the person who experienced it.

Read the situation carefully and internalize it from the specified person's perspective.
Reason in the first person about the five appraisal dimensions before predicting the person's emotion.

Every appraisal must be a concise natural-language first-person statement grounded only in the situation.
Do not invent facts, goals, intentions, relationships, consequences, or value conflicts.

Return exactly one valid JSON object without markdown or commentary."""
user = """Instruction: Imagine you are {target_role}, the person described in the following situation.
Read it carefully and internalize the feelings and situation from this person's perspective.
When answering, think back to the moment when the events described in the situation had just ended.

